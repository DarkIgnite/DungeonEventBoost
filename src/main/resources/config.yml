# Pengaturan Fitur Boost
boosts:
  # 1. MythicMobs Drop Multiplier
  mythicmobs-drops:
    enabled: true
    multiplier: 2.0
    filter-by-faction: true
    allowed-factions:
      - "Dungeon"
    filter-by-mob-types: false
    allowed-mob-types: []
    all-mythic-mobs: false
    require-player-killer: false

  # 2. AuraSkills EXP Multiplier
  auraskills-exp:
    enabled: true
    multiplier: 2.0
    filter-by-skills: false
    allowed-skills: []

  # 3. Dungeon MythicMobs Damage Boost
  dungeon-damage:
    enabled: true
    multiplier: 2.0
    filter-by-faction: true
    allowed-factions:
      - "Dungeon"
    filter-by-mob-types: false
    allowed-mob-types: []
    all-mythic-mobs: false
    effects:
      particle: "CRIT"
      particle-count: 8
      play-sound: true
      sound: "ENTITY_PLAYER_ATTACK_CRIT"
      sound-volume: 0.8
      sound-pitch: 1.2

  # 4. Dungeon Defense (Pengurangan Damage dari Mob Dungeon)
  dungeon-defense:
    enabled: true
    # 0.5 = damage dari mob dungeon ke player terpotong 50%
    multiplier: 0.5

  # 5. Economy (Jobs & Mob Money)
  economy-jobs:
    enabled: true
    multiplier: 2.0
    double-points: true

  # 6. Vanilla EXP
  vanilla-exp:
    enabled: true
    multiplier: 2.0

  # 7. Dungeon Swiftness
  dungeon-swiftness:
    enabled: true
    duration-seconds: 20
    # 1 = Speed II, Haste II (amplifier 0 adalah Level 1, amplifier 1 adalah Level 2)
    speed-amplifier: 1
    haste-amplifier: 1

  # 8. Koki MBG Boost
  koki-mbg:
    enabled: true
    multiplier-5x: 5.0
    multiplier-10x: 10.0
    mega-frenzy-multiplier: 5.0

# ================================================================
#                 FITUR ITEM RAMUAN (BOOST POTIONS)
#   Setiap jenis event boost dapat dibuat menjadi item potion
#   yang dapat diminum/dikonsumsi pemain dengan durasi tersendiri.
# ================================================================
potion-items:
  # Konsumsi instan saat klik kanan (true = instan klik kanan, false = minum vanilla)
  instant-consume: true
  # Berikan botol kaca kosong setelah mengonsumsi (hanya mode survival/adventure)
  return-empty-bottle: true
  # Tampilkan BossBar status hitung mundur saat memiliki boost aktif
  bossbar-enabled: true
  bossbar-format: "<gradient:#FFAA00:#FF5500><bold>🧪 {event_name} ⚡</bold></gradient> <gray>(<white>{time_left}</white>)</gray>"
  bossbar-style: "SOLID"
  # Tampilkan ActionBar status hitung mundur saat memiliki boost aktif (opsional, default nonaktif karena digantikan BossBar)
  actionbar-enabled: false
  actionbar-format: "<gradient:#FFAA00:#FF5500><bold>⚡ BOOST AKTIF:</bold></gradient> {boosts}"
  # Mode penumpukan waktu jika meminum ramuan yang sama:
  # EXTEND = Menambah sisa durasi (durasi bertumpuk)
  # REPLACE = Mengganti durasi dengan durasi baru
  # DENY = Menolak jika ramuan yang sama sedang aktif
  stack-mode: "EXTEND"
  # Penggabungan dengan event global jika keduanya aktif bersamaan:
  # MAX = Mengambil pengali tertinggi (direkomendasikan, seimbang)
  # MULTIPLY = Mengalikan keduanya (contoh: 2x global * 2x potion = 4x)
  global-stack-mode: "MAX"

  # Efek Suara saat meminum ramuan (suara tegukan)
  sound-consume:
    enabled: true
    sound: "ENTITY_GENERIC_DRINK"
    volume: 1.0
    pitch: 1.0

  # Efek Suara sekunder aktivasi ramuan (suara power up)
  sound-consume-success:
    enabled: true
    sound: "ENTITY_PLAYER_LEVELUP"
    volume: 0.8
    pitch: 1.5

  # Efek Suara saat durasi ramuan habis
  sound-expire:
    enabled: true
    sound: "BLOCK_BEACON_DEACTIVATE"
    volume: 0.8
    pitch: 1.2

  # Efek Partikel saat meminum ramuan
  particle-consume:
    enabled: true
    particle: "ENTITY_EFFECT"
    count: 15

  # Konfigurasi Tampilan Tiap Jenis Ramuan
  items:
    DROPS:
      material: "POTION"
      potion-color: "#55FF55"
      custom-model-data: 0
      glow: true
      default-duration-minutes: 10
      name: "<gradient:#55FF55:#00AA00><bold>🧪 Ramuan 2x Dungeon Drops</bold></gradient>"
      lore:
        - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"
        - "<gray>Tipe: <green><bold>Ramuan Dungeon Boost</bold></green></gray>"
        - ""
        - "<white>Efek Ramuan:</white>"
        - "  <gold>»</gold> <green>Menggandakan seluruh item drop dari</green>"
        - "    <green>mob dungeon MythicMobs!</green>"
        - ""
        - "<gray>Durasi Efek: <yellow><bold>{duration}</bold></yellow></gray>"
        - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"
