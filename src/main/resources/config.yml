# ================================================================
#                   DungeonEventBoost Configuration
#              Author: DarkIgnite | Server: Survival Season 7
# ================================================================

# Pengaturan Interval & Jadwal Event
event:
  # Berapa jam sekali event boost terjadi (misal: 6 jam)
  interval-hours: 6.0
  # Berapa menit event boost berlangsung (misal: 10 menit)
  duration-minutes: 10.0
  # Otomatis menjalankan timer ketika server dinyalakan
  auto-start-timer: true
  # Simpan sisa waktu countdown saat server restart agar tidak ter-reset
  save-state-on-restart: true

  # Mode pemilihan event:
  # ROTATION = Berputar berurutan (Drops -> EXP Skills -> Damage -> Defense -> Economy -> Vanilla EXP -> Swiftness)
  # RANDOM   = Diundi acak setiap jadwal tiba
  selection-mode: "ROTATION"

  # Peluang munculnya event MEGA_FRENZY jika menggunakan mode RANDOM (0.1 = 10% chance)
  mega-frenzy-chance: 0.1

  # Daftar jenis event yang aktif masuk dalam jadwal otomatis:
  # Pilihan: DROPS, EXP_SKILLS, DAMAGE_DEALT, DEFENSE, ECONOMY, EXP_VANILLA, SWIFTNESS, MEGA_FRENZY, KOKI_MBG_5X, KOKI_MBG_10X
  enabled-events:
    - "DROPS"
    - "EXP_SKILLS"
    - "DAMAGE_DEALT"
    - "DEFENSE"
    - "ECONOMY"
    - "EXP_VANILLA"
    - "SWIFTNESS"

