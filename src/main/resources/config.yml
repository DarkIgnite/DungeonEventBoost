# Pengaturan Fitur Boost
boosts:
  # 1. MythicMobs Drop Multiplier
  mythicmobs-drops:
    enabled: true
    multiplier: 2.0
    filter-by-faction: true
    allowed-factions:
      - "Dungeon"
    filter-by-mob-types: false
    allowed-mob-types: []
    all-mythic-mobs: false
    require-player-killer: false

  # 2. AuraSkills EXP Multiplier
  auraskills-exp:
    enabled: true
    multiplier: 2.0
    filter-by-skills: false
    allowed-skills: []

  # 3. Dungeon MythicMobs Damage Boost
  dungeon-damage:
    enabled: true
    multiplier: 2.0
    filter-by-faction: true
    allowed-factions:
      - "Dungeon"
    filter-by-mob-types: false
    allowed-mob-types: []
    all-mythic-mobs: false
    effects:
      particle: "CRIT"
      particle-count: 8
      play-sound: true
      sound: "ENTITY_PLAYER_ATTACK_CRIT"
      sound-volume: 0.8
      sound-pitch: 1.2

  # 4. Dungeon Defense (Pengurangan Damage dari Mob Dungeon)
  dungeon-defense:
    enabled: true
    # 0.5 = damage dari mob dungeon ke player terpotong 50%
    multiplier: 0.5

  # 5. Economy (Jobs & Mob Money)
  economy-jobs:
    enabled: true
    multiplier: 2.0
    double-points: true

  # 6. Vanilla EXP
  vanilla-exp:
    enabled: true
    multiplier: 2.0

  # 7. Dungeon Swiftness
  dungeon-swiftness:
    enabled: true
    duration-seconds: 20
    # 1 = Speed II, Haste II (amplifier 0 adalah Level 1, amplifier 1 adalah Level 2)
    speed-amplifier: 1
    haste-amplifier: 1

  # 8. Koki MBG Boost
  koki-mbg:
    enabled: true
    multiplier-5x: 5.0
    multiplier-10x: 10.0
    mega-frenzy-multiplier: 5.0

# Batasan Dunia (World Whitelist)
worlds:
  whitelist-enabled: false
  allowed-worlds:
    - "world"
    - "world_nether"
    - "world_the_end"

# BossBar
bossbar:
  enabled: true
  style: "SOLID"

# Peringatan Countdown Sebelum Event Dimulai (dalam detik)
countdown-warnings:
  enabled: true
  times-in-seconds:
    - 1800 # 30 menit
    - 900  # 15 menit
    - 300  # 5 menit
    - 60   # 1 menit
    - 30   # 30 detik
    - 10   # 10 detik
    - 5    # 5 detik
    - 4    # 4 detik
    - 3    # 3 detik
    - 2    # 2 detik
    - 1    # 1 detik

# Tampilan Title di Layar Pemain
titles:
  start:
    enabled: true
    fade-in: 10
    stay: 70
    fade-out: 20
  end:
    enabled: true
    title: "<red><bold>⚡ EVENT TELAH SELESAI ⚡</bold></red>"
    subtitle: "<gray>Event boost telah berakhir. Terima kasih!</gray>"
    fade-in: 10
    stay: 60
    fade-out: 20

# Efek Suara
sounds:
  start:
    enabled: true
    sound: "UI_TOAST_CHALLENGE_COMPLETE"
    volume: 1.0
    pitch: 1.0
  end:
    enabled: true
    sound: "BLOCK_BEACON_DEACTIVATE"
    volume: 1.0
    pitch: 0.8
  countdown-tick:
    enabled: true
    sound: "BLOCK_NOTE_BLOCK_PLING"
    volume: 0.8
    pitch: 1.5

# Pesan-pesan Plugin (Mendukung MiniMessage, Hex, Legacy '&', dan Tag <center>)
messages:
  prefix: "<gradient:#FFAA00:#FF5500><bold>[BOOST]</bold></gradient> "
  no-permission: "<red>Kamu tidak memiliki izin untuk menggunakan perintah ini!</red>"
  reloaded: "<green>Konfigurasi <white>DungeonEventBoost</white> berhasil dimuat ulang!</green>"
  already-active: "<red>Event boost sedang berlangsung! Gunakan <yellow>/eb stop</yellow> jika ingin membatalkannya.</red>"
  not-active: "<red>Tidak ada event boost yang sedang aktif saat ini.</red>"
  started-manual: "<green>Event <white>{event_name}</white> berhasil dimulai secara manual selama <white>{duration}</white> menit!</green>"
  stopped-manual: "<yellow>Event boost berhasil dihentikan oleh admin.</yellow>"

  # Pesan Siaran (Broadcast) Mulai Event
  broadcast-start:
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"
    - "<center><gradient:#FFAA00:#FF5500><bold>⚡ EVENT BOOST DIMULAI! ⚡</bold></gradient></center>"
    - "<center><gray>Jenis Event: <white><bold>{event_name}</bold></white></gray></center>"
    - "<center><gray>Durasi: <gold><bold>{duration} Menit</bold></gold></gray></center>"
    - ""
    - "  <gold>»</gold> {event_tag}"
    - ""
    - "<center><yellow>Ayo manfaatkan kesempatan ini dan ramaikan grinding!</yellow></center>"
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"

  # Pesan Siaran (Broadcast) Berakhir Event
  broadcast-end:
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"
    - "<center><red><bold>⚡ EVENT TELAH BERAKHIR! ⚡</bold></red></center>"
    - "<center><gray>Event <white>{event_name}</white> telah selesai.</gray></center>"
    - "<center><gray>Event berikutnya akan dimulai dalam: <yellow><bold>{next_event_time}</bold></yellow></gray></center>"
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"

  # Peringatan Countdown
  broadcast-countdown: "<yellow>⚡ Event Boost berikutnya akan dimulai dalam waktu <gold><bold>{time_left}</bold></gold>!</yellow>"

  # Status Informasi Perintah /eb status
  status-active:
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"
    - "<gradient:#FFAA00:#FF5500><bold>⚡ STATUS EVENT BOOST: <green>SEDANG AKTIF</green> ⚡</bold></gradient>"
    - "<gray>Jenis Event: <white><bold>{event_name}</bold></white></gray>"
    - "<gray>Sisa Waktu: <yellow><bold>{time_left}</bold></yellow></gray>"
    - "<gray>Efek:</gray> {event_tag}"
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"

  status-inactive:
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"
    - "<gradient:#FFAA00:#FF5500><bold>⚡ STATUS EVENT BOOST: <red>TIDAK AKTIF</red> ⚡</bold></gradient>"
    - "<gray>Event berikutnya akan dimulai dalam: <yellow><bold>{next_event_time}</bold></yellow></gray>"
    - "<gray>Interval: <white>{interval} Jam</white> | Durasi: <white>{duration} Menit</white></gray>"
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"

  # Menu Bantuan /eb help
  help:
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"
    - "<gradient:#FFAA00:#FF5500><bold>⚡ DungeonEventBoost Commands ⚡</bold></gradient>"
    - "<gold>/eb status</gold> <gray>- Cek status dan sisa waktu event</gray>"
    - "<gold>/eb start [jenis] [menit]</gold> <gray>- Memulai event tertentu secara manual</gray>"
    - "<gray>  Pilihan jenis: drops, exp_skills, damage, defense, economy, exp_vanilla, swiftness, all, koki_5x, koki_10x</gray>"
    - "<gold>/eb stop</gold> <gray>- Menghentikan event boost yang sedang aktif (Admin)</gray>"
