countdown-warnings:
  enabled: true
  times-in-seconds:
    - 1800 # 30 menit
    - 900  # 15 menit
    - 300  # 5 menit
    - 60   # 1 menit
    - 30   # 30 detik
    - 10   # 10 detik
    - 5    # 5 detik
    - 4    # 4 detik
    - 3    # 3 detik
    - 2    # 2 detik
    - 1    # 1 detik

# Tampilan Title di Layar Pemain
titles:
  start:
    enabled: true
    fade-in: 10
    stay: 70
    fade-out: 20
  end:
    enabled: true
    title: "<red><bold>⚡ EVENT TELAH SELESAI ⚡</bold></red>"
    subtitle: "<gray>Event boost telah berakhir. Terima kasih!</gray>"
    fade-in: 10
    stay: 60
    fade-out: 20

# Efek Suara
sounds:
  start:
    enabled: true
    sound: "UI_TOAST_CHALLENGE_COMPLETE"
    volume: 1.0
    pitch: 1.0
  end:
    enabled: true
    sound: "BLOCK_BEACON_DEACTIVATE"
    volume: 1.0
    pitch: 0.8
  countdown-tick:
    enabled: true
    sound: "BLOCK_NOTE_BLOCK_PLING"
    volume: 0.8
    pitch: 1.5

# Pesan-pesan Plugin (Mendukung MiniMessage, Hex, Legacy '&', dan Tag <center>)
messages:
  prefix: "<gradient:#FFAA00:#FF5500><bold>[BOOST]</bold></gradient> "
  no-permission: "<red>Kamu tidak memiliki izin untuk menggunakan perintah ini!</red>"
  reloaded: "<green>Konfigurasi <white>DungeonEventBoost</white> berhasil dimuat ulang!</green>"
  already-active: "<red>Event boost sedang berlangsung! Gunakan <yellow>/eb stop</yellow> jika ingin membatalkannya.</red>"
  not-active: "<red>Tidak ada event boost yang sedang aktif saat ini.</red>"
  started-manual: "<green>Event <white>{event_name}</white> berhasil dimulai secara manual selama <white>{duration}</white> menit!</green>"
  stopped-manual: "<yellow>Event boost berhasil dihentikan oleh admin.</yellow>"

  # Pesan Terkait Ramuan (Potions)
  potion-consumed: "<green>⚡ Kamu meminum <white>{item_name}</white>! Efek <white>{event_name}</white> aktif selama <yellow>{duration}</yellow>!</green>"
  potion-extended: "<green>⚡ Durasi efek <white>{event_name}</white> diperpanjang! Total sisa waktu: <yellow>{duration}</yellow>!</green>"
  potion-expired: "<red>⚡ Efek ramuan <white>{event_name}</white> kamu telah berakhir!</red>"
  potion-given: "<green>Berhasil memberikan <white>{amount}x {item_name}</white> ke <yellow>{player}</yellow> (<white>{duration}</white>).</green>"
  potion-received: "<green>⚡ Kamu menerima <white>{amount}x {item_name}</white> (<white>{duration}</white>)!</green>"

  # Pesan Menghapus Efek Boost (/eb remove)
  boost-removed-admin: "<green>Berhasil menghapus efek boost <white>{event_name}</white> dari <yellow>{player}</yellow>.</green>"
  boost-removed-all-admin: "<green>Berhasil menghapus seluruh efek boost personal dari <yellow>{player}</yellow>.</green>"
  boost-removed-player: "<yellow>⚡ Efek boost <white>{event_name}</white> kamu telah dihentikan oleh admin.</yellow>"
  boost-removed-all-player: "<yellow>⚡ Seluruh efek boost personal kamu telah dihentikan oleh admin.</yellow>"
  boost-not-found: "<red>Pemain <white>{player}</white> tidak memiliki efek boost <yellow>{type}</yellow> yang sedang aktif!</red>"
  boost-none-active: "<red>Pemain <white>{player}</white> tidak memiliki efek boost personal yang sedang aktif!</red>"

  # Pesan Informasi Status Personal (/eb myboost)
  myboost-none: "<yellow>Kamu tidak memiliki efek ramuan boost yang sedang aktif saat ini.</yellow>"
  myboost-header:
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"
    - "<center><gradient:#FFAA00:#FF5500><bold>⚡ STATUS BOOST PERSONAL KAMU ⚡</bold></gradient></center>"
  myboost-entry: "  <gold>»</gold> <white>{event_name}</white>: <yellow><bold>{time_left}</bold></yellow>"
  myboost-footer:
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"

  # Pesan Siaran (Broadcast) Mulai Event
  broadcast-start:
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"
    - "<center><gradient:#FFAA00:#FF5500><bold>⚡ EVENT BOOST DIMULAI! ⚡</bold></gradient></center>"
    - "<center><gray>Jenis Event: <white><bold>{event_name}</bold></white></gray></center>"
    - "<center><gray>Durasi: <gold><bold>{duration} Menit</bold></gold></gray></center>"
    - ""
    - "  <gold>»</gold> {event_tag}"
    - ""
    - "<center><yellow>Ayo manfaatkan kesempatan ini dan ramaikan grinding!</yellow></center>"
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"

  # Pesan Siaran (Broadcast) Berakhir Event
  broadcast-end:
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"
    - "<center><red><bold>⚡ EVENT TELAH BERAKHIR! ⚡</bold></red></center>"
    - "<center><gray>Event <white>{event_name}</white> telah selesai.</gray></center>"
    - "<center><gray>Event berikutnya akan dimulai dalam: <yellow><bold>{next_event_time}</bold></yellow></gray></center>"
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"

  # Peringatan Countdown
  broadcast-countdown: "<yellow>⚡ Event Boost berikutnya akan dimulai dalam waktu <gold><bold>{time_left}</bold></gold>!</yellow>"

  # Status Informasi Perintah /eb status
  status-active:
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"
    - "<gradient:#FFAA00:#FF5500><bold>⚡ STATUS EVENT BOOST: <green>SEDANG AKTIF</green> ⚡</bold></gradient>"
    - "<gray>Jenis Event: <white><bold>{event_name}</bold></white></gray>"
    - "<gray>Sisa Waktu: <yellow><bold>{time_left}</bold></yellow></gray>"
    - "<gray>Efek:</gray> {event_tag}"
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"

  status-inactive:
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"
    - "<gradient:#FFAA00:#FF5500><bold>⚡ STATUS EVENT BOOST: <red>TIDAK AKTIF</red> ⚡</bold></gradient>"
    - "<gray>Event berikutnya akan dimulai dalam: <yellow><bold>{next_event_time}</bold></yellow></gray>"
    - "<gray>Interval: <white>{interval} Jam</white> | Durasi: <white>{duration} Menit</white></gray>"
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"

  # Menu Bantuan /eb help
  help:
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"
    - "<gradient:#FFAA00:#FF5500><bold>⚡ DungeonEventBoost Commands ⚡</bold></gradient>"
    - "<gold>/eb status</gold> <gray>- Cek status dan sisa waktu event global</gray>"
    - "<gold>/eb myboost</gold> <gray>- Cek sisa waktu ramuan boost personal milikmu</gray>"
    - "<gold>/eb start [jenis] [menit]</gold> <gray>- Memulai event global tertentu secara manual (Admin)</gray>"
    - "<gold>/eb stop</gold> <gray>- Menghentikan event global yang sedang aktif (Admin)</gray>"
    - "<gold>/eb give <player> <jenis> [menit] [jumlah]</gold> <gray>- Memberikan ramuan boost ke pemain (Admin)</gray>"
    - "<gold>/eb giveall <jenis> [menit] [jumlah]</gold> <gray>- Membagikan ramuan boost ke seluruh pemain online (Admin)</gray>"
    - "<gold>/eb remove <player> [jenis]</gold> <gray>- Menghapus efek boost personal dari pemain (Admin)</gray>"
    - "<gray>  Pilihan jenis: drops, exp_skills, damage, defense, economy, exp_vanilla, swiftness, all, koki_5x, koki_10x</gray>"
    - "<gold>/eb reload</gold> <gray>- Memuat ulang konfigurasi plugin (Admin)</gray>"
    - "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"
